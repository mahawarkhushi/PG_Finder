spring.application.name=bangalore-pg-finder
server.port=8080

# Database Connection (Matches our Docker container)
spring.datasource.url=jdbc:postgresql://localhost:5432/pg_finder_db
spring.datasource.username=pgfinder_user
spring.datasource.password=pg_password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
# 'update' automatically creates the tables in PostgreSQL from your Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true