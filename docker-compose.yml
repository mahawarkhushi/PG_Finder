services:
  postgres:
    image: postgres:16-alpine
    container_name: bangalore_pg_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pg_finder_db
      POSTGRES_USER: pgfinder_user
      POSTGRES_PASSWORD: pg_password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bangalore_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgfinder.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
